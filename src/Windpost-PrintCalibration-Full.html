<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Windpost A4 Print Calibration</title>
  <style>
:root {
  --ink: #142337;
  --muted: #657488;
  --line: #d7e0e7;
  --panel: #ffffff;
  --soft: #f4f7fa;
  --accent: #a83920;
}

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body {
  background: var(--soft);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

.page-header {
  min-height: 82px;
  padding: 17px clamp(20px, 4vw, 58px);
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.page-header p, .eyebrow {
  margin: 0 0 5px;
  color: var(--accent);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}

h1, h2 { margin: 0; }
h1 { font-size: 24px; }
h2 { font-size: 19px; }

.drawing-workflow {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #f5f7f9;
}

.drawing-workflow a,
.drawing-workflow span {
  min-height: 34px;
  padding: 0 14px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
}

.drawing-workflow a:hover {
  background: #e5ebf0;
}

.drawing-workflow a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.drawing-workflow span {
  color: #fff;
  background: var(--accent);
}

main {
  position: relative;
  width: min(1420px, calc(100% - 32px));
  margin: 24px auto;
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr);
  gap: 20px;
}

.controls, .viewer, .drawing {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 8px 28px rgba(20, 35, 55, .07);
}

.controls {
  padding: 22px;
  align-self: start;
}

form {
  margin-top: 22px;
  display: grid;
  gap: 15px;
}

label {
  display: grid;
  gap: 7px;
  color: #34465c;
  font-size: 12px;
  font-weight: 700;
}

select, input, button {
  min-height: 43px;
  border: 1px solid #c8d3dc;
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font: inherit;
}

select, input { width: 100%; padding: 0 11px; }

.number-field {
  position: relative;
  display: block;
}

.number-field input { padding-right: 45px; }

.number-field em {
  position: absolute;
  right: 12px;
  top: 14px;
  color: var(--muted);
  font-size: 11px;
  font-style: normal;
  font-weight: 700;
}

button {
  padding: 0 16px;
  cursor: pointer;
  font-weight: 800;
}

form button {
  border-color: var(--ink);
  background: var(--ink);
  color: #fff;
}

dl {
  margin: 22px 0 0;
  border-top: 1px solid var(--line);
}

dl div {
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

dt { color: var(--muted); font-size: 11px; }
dd { margin: 0; font-size: 12px; font-weight: 800; }

.viewer { min-width: 0; overflow: hidden; position: relative; }

/* Section badge laid over the WebGL canvas (the 2D fallback paints its own). */
.viewer-badge {
  position: absolute;
  left: 18px;
  top: 94px;
  padding: 9px 13px 8px;
  border: 1px solid rgba(18, 34, 53, .18);
  border-radius: 8px;
  background: rgba(255, 255, 255, .9);
  box-shadow: 0 4px 14px rgba(18, 34, 53, .08);
  pointer-events: none;
  display: grid;
  gap: 3px;
  max-width: 320px;
}
.viewer-badge strong { font-size: 12px; color: #122235; }
.viewer-badge span { font-size: 10px; color: #536478; }

.drawing {
  grid-column: 1 / -1;
  min-width: 0;
  overflow: hidden;
}

.viewer-header {
  min-height: 76px;
  padding: 17px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.viewer-header button { background: #edf2f5; }

.viewer-actions,
.drawing-actions,
.drawing-mode {
  display: flex;
  align-items: center;
  gap: 8px;
}

.drawing-mode {
  gap: 0;
}

.drawing-mode button {
  min-height: 38px;
  border-radius: 0;
  background: #fff;
}

.drawing-mode button:first-child {
  border-radius: 6px 0 0 6px;
}

.drawing-mode button:last-child {
  margin-left: -1px;
  border-radius: 0 6px 6px 0;
}

.drawing-mode button[aria-pressed="true"] {
  position: relative;
  z-index: 1;
  border-color: var(--ink);
  background: var(--ink);
  color: #fff;
}

.drawing-sheet {
  padding: 18px;
  overflow: auto;
  background: #eef2f5;
}

.drawing-sheet svg {
  display: block;
  width: 100%;
  height: auto;
  background: #fff;
  box-shadow: 0 5px 20px rgba(20, 35, 55, .09);
}

.engineering-hybrid-stage {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 5px 20px rgba(20, 35, 55, .09);
}

.engineering-hybrid-stage .engineering-fill-canvas,
.engineering-hybrid-stage > svg {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  min-height: 0;
  background: transparent;
  box-shadow: none;
}

.engineering-hybrid-stage .engineering-fill-canvas {
  pointer-events: none;
}

.engineering-hybrid-stage > svg { z-index: 1; }

.baseplate-sheet svg {
  max-width: none !important;
}

.production-source-only {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 1px;
  border: 1px solid transparent;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}

.production-source-only .baseplate-sheet {
  width: auto;
  padding: 18px;
}

.production-source-only .baseplate-sheet svg {
  display: block;
  width: 100%;
  height: auto;
}

.drawing-error {
  margin: 0;
  padding: 26px;
  border: 1px solid #d5a9a1;
  background: #fff8f6;
  color: #7e2818;
  font-size: 13px;
}

.production-details {
  margin: 0;
  padding: 18px 20px 16px;
  display: block;
  border-bottom: 1px solid var(--line);
  background: #fbfcfd;
}

.production-details-heading {
  margin-bottom: 15px;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
}

.production-details-heading h3 {
  margin: 0;
  font-size: 16px;
}

.production-details-heading > p {
  max-width: 510px;
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  text-align: right;
}

.production-details-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px 14px;
}

.production-details label {
  min-width: 0;
}

.production-details input {
  min-height: 39px;
  background: #fff;
}

.production-details input:focus {
  outline: 2px solid rgba(168, 57, 32, .2);
  border-color: var(--accent);
}

.production-export-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.button-link {
  min-height: 38px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  border: 1px solid #adb8c1;
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  text-decoration: none;
  font-size: 12px;
  font-weight: 700;
}

canvas {
  display: block;
  width: 100%;
  height: min(75vh, 820px);
  min-height: 540px;
  outline: none;
  touch-action: none;
  cursor: grab;
}

canvas[data-interaction-mode="pan"] { cursor: move; }
canvas.is-dragging { cursor: grabbing; }

canvas:focus { box-shadow: inset 0 0 0 3px rgba(47, 127, 145, .28); }

.viewer-help {
  min-height: 42px;
  padding: 0 20px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 22px;
  font-size: 11px;
}

@media (max-width: 820px) {
  main { grid-template-columns: 1fr; }
  canvas { height: 64vh; min-height: 460px; }
  .drawing-actions { align-items: stretch; flex-direction: column; }
  .production-details-heading {
    align-items: start;
    flex-direction: column;
    gap: 6px;
  }
  .production-details-heading > p { text-align: left; }
  .production-details-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 520px) {
  .page-header {
    align-items: flex-start;
    flex-direction: column;
  }
  .drawing-workflow { align-self: stretch; }
  .drawing-workflow a,
  .drawing-workflow span { flex: 1; }
  .production-details-grid { grid-template-columns: 1fr; }
}

@page {
  size: A4 portrait;
  margin: 0;
}

.visual-regression {
  width: 794px;
  margin: 0;
  background: #fff;
}

.visual-regression .page-header,
.visual-regression .controls,
.visual-regression .viewer,
.visual-regression .drawing:not(:has(#combined-a4-sheet)),
.visual-regression .drawing > .viewer-header,
.visual-regression .production-details {
  display: none !important;
}

.visual-regression main,
.visual-regression .drawing {
  display: block;
  width: 794px;
  margin: 0;
  border: 0;
  box-shadow: none;
}

.visual-regression .drawing-sheet {
  padding: 0;
  overflow: visible;
  background: #fff;
}

.visual-regression #combined-a4-sheet svg {
  width: 794px !important;
  max-width: none !important;
  height: auto !important;
  box-shadow: none;
}

@media print {
  html, body { background: #fff; }

  /* hide the UI and every sheet except the combined A4 sheet */
  .page-header,
  .controls,
  .viewer,
  .drawing > .viewer-header,
  .production-details {
    display: none !important;
  }
  .drawing:has(#orthographic-drawing),
  .drawing:has(#cantilever-baseplate-drawing) {
    display: none !important;
  }

  main {
    display: block;
    width: auto;
    margin: 0;
  }

  .drawing {
    display: block;
    width: auto;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  .drawing-sheet {
    padding: 0;
    overflow: visible;
    background: #fff;
  }

  /* the A4 sheet SVG is a 210x297 mm viewBox — print it 1:1, no stretch */
  #combined-a4-sheet svg {
    width: 210mm !important;
    height: 297mm !important;
    max-width: none !important;
    box-shadow: none;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}

/* Production drawing validation (errors block export, warnings advise). */
.validation-results { margin: 0 20px 14px; font-size: 12px; }
.validation-summary {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: #f3f7f4; color: #14532d;
}
.validation-summary.is-warning { background: #fff7e6; color: #7a4b00; border-color: #f2d9a6; }
.validation-summary.is-fail { background: #fdeceb; color: #7f1d1d; border-color: #f3b4b0; }
.validation-summary span { font-size: 11px; opacity: .85; }
.validation-checks { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.validation-checks li { display: flex; gap: 9px; align-items: flex-start; padding: 5px 8px; border-radius: 6px; }
.validation-checks li > span { width: 16px; text-align: center; font-weight: 800; flex: none; }
.validation-checks li.is-pass { color: #4b5a67; }
.validation-checks li.is-pass > span { color: #137a3e; }
.validation-checks li.is-warning { background: #fff7e6; color: #7a4b00; }
.validation-checks li.is-error { background: #fdeceb; color: #7f1d1d; }
.validation-checks li small { display: block; font-size: 11px; opacity: .9; }
.visual-regression .validation-results { display: none; }

.drawing-mode button:not(:first-child):not(:last-child) { border-radius: 0; }

.page-notice { margin: 0; padding: 10px 24px; background: #fdecea; color: #b3261e; font-weight: 700; font-size: 13px; }

</style>
  <style>
    body{background:#eef2f5}
    .calibration-toolbar{max-width:920px;margin:18px auto;display:flex;
      align-items:center;justify-content:space-between;gap:12px}
    .calibration-toolbar h1{margin:0;font-size:20px}
    .calibration-actions{display:flex;gap:8px;flex-wrap:wrap}
    #calibration-sheet{width:min(794px,calc(100vw - 32px));margin:0 auto 30px;
      background:#fff;box-shadow:0 5px 22px rgba(20,35,55,.16)}
    #calibration-sheet svg{display:block;width:100%;height:auto}
    @page{size:A4 portrait;margin:0}
    @media print{
      .calibration-toolbar{display:none!important}
      body{margin:0;background:#fff}
      #calibration-sheet{width:210mm;margin:0;box-shadow:none}
      #calibration-sheet svg{width:210mm!important;height:297mm!important}
    }
  </style>
</head>
<body>
  <header class="calibration-toolbar">
    <div>
      <p class="eyebrow">Production control</p>
      <h1>A4 print calibration</h1>
    </div>
    <div class="calibration-actions">
      <a href="./l-section-prototype.html">Back to detailing</a>
      <button id="download-calibration" type="button">Download SVG</button>
      <button id="print-calibration" type="button">Print at 100%</button>
    </div>
  </header>
  <main id="calibration-sheet" aria-live="polite"></main>
  <script>
(function initialisePrintCalibrationService(global) {
  "use strict";

  const windpost = global.Windpost = global.Windpost || {};

  function sheet() {
    const weights = [.13, .18, .25, .35, .5, .7];
    const samples = weights.map((weight, index) => {
      const y = 170 + index * 10;
      return `<line x1="24" y1="${y}" x2="130" y2="${y}" `
        + `stroke="#000" stroke-width="${weight}"/>`
        + `<text x="137" y="${y + 1}" font-size="3.2">${weight} mm</text>`;
    }).join("");
    return `<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" `
      + `viewBox="0 0 210 297" role="img" data-print-calibration="v1" `
      + `font-family="Arial,Helvetica,sans-serif">`
      + `<defs><pattern id="cal-hatch" width="6" height="6" `
      + `patternUnits="userSpaceOnUse" patternTransform="rotate(45)">`
      + `<line x1="0" y1="0" x2="0" y2="6" stroke="#777" stroke-width=".25"/>`
      + `</pattern></defs>`
      + `<rect width="210" height="297" fill="#fff"/>`
      + `<rect x="4" y="4" width="202" height="289" fill="none" `
      + `stroke="#000" stroke-width=".35"/>`
      + `<text x="15" y="17" font-size="5" font-weight="700">`
      + `WINDPOST PRINT CALIBRATION — A4 PORTRAIT</text>`
      + `<text x="15" y="24" font-size="3.2">Print at 100% / Actual size. `
      + `Disable “Fit to page”.</text>`
      + `<rect x="20" y="34" width="100" height="100" fill="none" `
      + `stroke="#000" stroke-width=".35" data-calibration-square-mm="100"/>`
      + `<line x1="20" y1="84" x2="120" y2="84" stroke="#777" `
      + `stroke-width=".18" stroke-dasharray="3 2"/>`
      + `<line x1="70" y1="34" x2="70" y2="134" stroke="#777" `
      + `stroke-width=".18" stroke-dasharray="3 2"/>`
      + `<text x="70" y="141" text-anchor="middle" font-size="3.5" `
      + `font-weight="700">100 × 100 mm CHECK SQUARE</text>`
      + `<rect x="137" y="34" width="48" height="48" fill="url(#cal-hatch)" `
      + `stroke="#000" stroke-width=".25"/>`
      + `<text x="161" y="89" text-anchor="middle" font-size="3.2">`
      + `0.25 mm CAD hatch</text>`
      + `<text x="20" y="158" font-size="4" font-weight="700">LINEWEIGHT TEST</text>`
      + samples
      + `<text x="20" y="240" font-size="2.4">2.4 mm text — minor annotations</text>`
      + `<text x="20" y="248" font-size="3.2">3.2 mm text — drawing annotations</text>`
      + `<text x="20" y="258" font-size="4.5" font-weight="700">`
      + `4.5 mm text — production headings</text>`
      + `<text x="20" y="276" font-size="3.1">Measured square: ______ mm × ______ mm</text>`
      + `<text x="20" y="283" font-size="3.1">Printer / settings: __________________________</text>`
      + `</svg>`;
  }

  windpost.printCalibrationService = Object.freeze({ sheet });

  if (typeof module !== "undefined" && module.exports) {
    module.exports = windpost.printCalibrationService;
  }
})(typeof window !== "undefined" ? window : globalThis);

</script>
  <script>
(function initialisePrintCalibrationPage(global) {
  "use strict";

  const windpost = global.Windpost;

  function download() {
    const svg = windpost.printCalibrationService.sheet();
    const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "windpost-a4-print-calibration.svg";
    document.body.appendChild(link);
    link.click();
    const url = link.href;
    link.remove();
    global.setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  // The page opens in its own tab from the Detailing page, so "Back" closes
  // the tab (or steps back) rather than loading a fresh Detailing page that
  // would show the default design instead of the handed-over one.
  function bindBackLink() {
    const back = document.querySelector(".calibration-actions a");
    if (!back) return;
    if (/Windpost-PrintCalibration-Full\.html$/i.test(
      decodeURIComponent((global.location && global.location.pathname) || ""))) {
      back.href = "./Windpost-Detailing-Full.html";
    }
    back.addEventListener("click", event => {
      event.preventDefault();
      if (global.history.length > 1) {
        global.history.back();
        return;
      }
      global.close();
      global.setTimeout(() => {
        if (!global.closed) global.location.href = back.getAttribute("href");
      }, 300);
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    bindBackLink();
    document.getElementById("calibration-sheet").innerHTML =
      windpost.printCalibrationService.sheet();
    document.getElementById("print-calibration").addEventListener(
      "click", () => global.print()
    );
    document.getElementById("download-calibration").addEventListener(
      "click", download
    );
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
